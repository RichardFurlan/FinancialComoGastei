name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ComoGastoMinhaGrana.sln

      - name: Build
        run: dotnet build ComoGastoMinhaGrana.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ComoGastoMinhaGrana.sln --no-build --configuration Release --verbosity normal

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/ComoGastoMinhaGrana.Api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cgmg-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/ComoGastoMinhaGrana.Worker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cgmg-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push UI
        uses: docker/build-push-action@v5
        with:
          context: ./ComoGastoMinhaGrana.UI
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cgmg-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/app/cgmg
            docker compose pull
            docker compose up -d
            docker image prune -f
