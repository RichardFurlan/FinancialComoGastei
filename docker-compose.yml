services:
  # --- BANCO DE DADOS ---
  db:
    image: postgres:17-alpine
    container_name: cgmg-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-comogasto_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-comogasto_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- CACHE ---
  redis:
    image: redis:7-alpine
    container_name: cgmg-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- MENSAGERIA ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cgmg-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cgmg_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"  # Painel de admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API ---
  api:
    build:
      context: .
      dockerfile: src/ComoGastoMinhaGrana.Api/Dockerfile
    container_name: cgmg-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-comogasto_db};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - OpenRouter__ApiKey=${OPENROUTER_API_KEY}
      - OpenRouter__Model=deepseek/deepseek-chat
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-cgmg_user}
      - RabbitMQ__Password=${RABBITMQ_PASS}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  # --- WORKER ---
  worker:
    build:
      context: .
      dockerfile: src/ComoGastoMinhaGrana.Worker/Dockerfile
    container_name: cgmg-worker
    restart: always
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB:-comogasto_db};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - OpenRouter__ApiKey=${OPENROUTER_API_KEY}
      - OpenRouter__Model=deepseek/deepseek-chat
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER:-cgmg_user}
      - RabbitMQ__Password=${RABBITMQ_PASS}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # --- FRONTEND ---
  ui:
    build:
      context: ./ComoGastoMinhaGrana.UI
      dockerfile: Dockerfile
    container_name: cgmg-ui
    restart: always
    expose:
      - "3000"
    depends_on:
      - api

  # --- REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: cgmg-nginx
    restart: always
    ports:
      - "80:80"   # Manter para acesso local de desenvolvimento
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui

  # --- LOGS (Seq) ---
  # UI disponível em http://localhost (via nginx /seq/) ou via Cloudflare Tunnel.
  # Veja docs/SEQ-SETUP.md para configuração completa na VPS + Cloudflare Access.
  seq:
    image: datalust/seq:latest
    container_name: cgmg-seq
    restart: always
    environment:
      - ACCEPT_EULA=Y
    expose:
      - "80"    # UI web
      - "5341"  # Ingestion HTTP (Serilog envia logs aqui)
    volumes:
      - seq_data:/data

  # --- CLOUDFLARE TUNNEL ---
  # Expõe o app na internet via Cloudflare sem abrir portas no firewall/roteador.
  # TLS é terminado na Cloudflare — não precisamos de certificados locais.
  # Para ativar: defina CF_TUNNEL_TOKEN no .env (veja .env.example).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cgmg-cloudflared
    restart: always
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel run
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  seq_data:
